debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=iam_user
debezium.source.database.password=iam_pass
debezium.source.database.dbname=iam_source
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.iam_denormalized
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_iam_slot
debezium.source.publication.name=debezium_iam_pub
debezium.source.topic.prefix=dev.iam
debezium.source.snapshot.mode=initial
debezium.source.tombstones.on.delete=false
debezium.source.offset.flush.interval.ms=0
debezium.source.offset.storage=io.debezium.server.iceberg.offset.IcebergOffsetBackingStore
debezium.source.offset.storage.iceberg.table-name=debezium_offset_storage_table
debezium.source.schema.history.internal=io.debezium.server.iceberg.history.IcebergSchemaHistory
debezium.source.schema.history.internal.iceberg.table-name=debezium_database_history_storage_table

# ============================================================
# SINK: Iceberg -- BRONZE layer, append-only (NOT upsert)
# Every insert/update/delete becomes a NEW immutable row.
# This is the permanent audit log; nothing here is ever overwritten.
# ============================================================
debezium.sink.type=iceberg
debezium.sink.iceberg.table-prefix=bronze_
debezium.sink.iceberg.upsert=false
debezium.sink.iceberg.write.format.default=parquet
debezium.sink.iceberg.catalog-name=iceberg
debezium.sink.iceberg.table-namespace=iam
debezium.sink.iceberg.catalog-impl=org.apache.iceberg.rest.RESTCatalog
debezium.sink.iceberg.uri=http://iceberg-rest:8181
debezium.sink.iceberg.warehouse=s3://datalake/warehouse
debezium.sink.iceberg.io-impl=org.apache.iceberg.io.ResolvingFileIO
debezium.sink.iceberg.s3.endpoint=http://minio:9000
debezium.sink.iceberg.s3.access-key-id=minioadmin
debezium.sink.iceberg.s3.secret-access-key=minioadmin
debezium.sink.iceberg.s3.path-style-access=true
debezium.sink.iceberg.client.region=us-east-1

debezium.format.value.schemas.enable=true
debezium.format.key.schemas.enable=true
debezium.format.value=json
debezium.format.key=json

debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.add.fields=op,table,source.ts_ns,db
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
debezium.transforms.unwrap.drop.tombstones=true
