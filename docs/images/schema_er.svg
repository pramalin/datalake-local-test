<svg viewBox="0 0 1180 800" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B9E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="800" fill="#FFFFFF"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#1E2761">Schema: Bronze Log, Star Schema, and Safe View</text>
  <text x="30" y="56" font-size="12" fill="#5B6B9E">Dashed lines = business-key match today, not an enforced surrogate-key FK (see "Known limitations").</text>

  <!-- BRONZE (top, full width) -->
  <rect x="30" y="80" width="1120" height="110" rx="10" fill="#1E2761"/>
  <text x="590" y="105" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">bronze_dev_iam_public_iam_denormalized  (append-only CDC log)</text>
  <text x="590" y="128" font-size="11" fill="#CADCFC" text-anchor="middle">grant_id, user_id, user_name, user_email, role_id, role_name, role_category,</text>
  <text x="590" y="146" font-size="11" fill="#CADCFC" text-anchor="middle">resource_id, resource_name, resource_type, granted_at, revoked_at, updated_at, is_deleted</text>
  <text x="590" y="166" font-size="11" fill="#9AA5C7" text-anchor="middle">+ CDC metadata: __op, __source_ts_ns, __table, __db, __deleted</text>

  <line x1="380" y1="190" x2="380" y2="230" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="800" y1="190" x2="800" y2="230" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="380" y="215" font-size="10" fill="#9AA5C7" text-anchor="middle">merge</text>
  <text x="800" y="215" font-size="10" fill="#9AA5C7" text-anchor="middle">merge</text>

  <!-- FACT: current state (Type 1) -->
  <rect x="230" y="230" width="300" height="130" rx="10" fill="#2E3E8F"/>
  <text x="380" y="255" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">fact_access_grant</text>
  <text x="380" y="272" font-size="10" fill="#9AA5C7" text-anchor="middle">Type 1 -- current state, one row per grant</text>
  <text x="380" y="292" font-size="11" fill="#CADCFC" text-anchor="middle">grant_id (PK)</text>
  <text x="380" y="308" font-size="11" fill="#CADCFC" text-anchor="middle">user_id, role_id, resource_id</text>
  <text x="380" y="324" font-size="11" fill="#CADCFC" text-anchor="middle">granted_at, revoked_at, updated_at</text>
  <text x="380" y="340" font-size="11" fill="#CADCFC" text-anchor="middle">is_deleted</text>
  <text x="380" y="354" font-size="10" fill="#F4C77B" text-anchor="middle">NOT pre-filtered to active-only</text>

  <!-- FACT HISTORY: access-period (Type 2) -->
  <rect x="650" y="230" width="300" height="150" rx="10" fill="#2E3E8F"/>
  <text x="800" y="255" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">fact_access_grant_history</text>
  <text x="800" y="272" font-size="10" fill="#9AA5C7" text-anchor="middle">Type 2 -- access-period model</text>
  <text x="800" y="292" font-size="11" fill="#CADCFC" text-anchor="middle">grant_id, user_id, role_id, resource_id</text>
  <text x="800" y="308" font-size="11" fill="#CADCFC" text-anchor="middle">granted_at, revoked_at</text>
  <text x="800" y="324" font-size="11" fill="#CADCFC" text-anchor="middle">effective_start, effective_end</text>
  <text x="800" y="340" font-size="11" fill="#CADCFC" text-anchor="middle">is_current, is_deleted</text>
  <text x="800" y="358" font-size="10" fill="#F4C77B" text-anchor="middle">revoke/delete CLOSES a row --</text>
  <text x="800" y="372" font-size="10" fill="#F4C77B" text-anchor="middle">never opens a new "current" one</text>

  <!-- current_active_access VIEW -->
  <line x1="380" y1="360" x2="380" y2="420" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="440" y="392" font-size="10" fill="#9AA5C7">view filter:</text>
  <text x="440" y="404" font-size="9" fill="#9AA5C7">revoked_at IS NULL AND is_deleted=false</text>
  <rect x="230" y="420" width="300" height="70" rx="10" fill="#1E2761"/>
  <text x="380" y="445" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">current_active_access</text>
  <text x="380" y="463" font-size="10" fill="#CADCFC" text-anchor="middle">VIEW -- safe for BI consumption</text>
  <text x="380" y="478" font-size="10" fill="#CADCFC" text-anchor="middle">(prevents "row exists" &#8800; "access active")</text>

  <!-- DIMENSIONS (bottom row) -->
  <text x="30" y="545" font-size="13" font-weight="bold" fill="#1E2761">Dimensions (declared, NOT YET populated or joined via surrogate keys)</text>

  <rect x="30" y="565" width="220" height="90" rx="10" fill="#F4F6FC" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="140" y="588" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">dim_user</text>
  <text x="140" y="608" font-size="10" fill="#5B6B9E" text-anchor="middle">user_id, user_name, user_email</text>
  <text x="140" y="626" font-size="9" fill="#B0392F" text-anchor="middle">empty -- not loaded</text>
  <text x="140" y="640" font-size="9" fill="#B0392F" text-anchor="middle">no surrogate key (user_sk)</text>

  <rect x="280" y="565" width="220" height="90" rx="10" fill="#F4F6FC" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="390" y="588" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">dim_role</text>
  <text x="390" y="608" font-size="10" fill="#5B6B9E" text-anchor="middle">role_id, role_name, role_category</text>
  <text x="390" y="626" font-size="9" fill="#B0392F" text-anchor="middle">empty -- not loaded</text>
  <text x="390" y="640" font-size="9" fill="#B0392F" text-anchor="middle">no surrogate key (role_sk)</text>

  <rect x="530" y="565" width="220" height="90" rx="10" fill="#F4F6FC" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="640" y="588" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">dim_resource</text>
  <text x="640" y="608" font-size="10" fill="#5B6B9E" text-anchor="middle">resource_id, resource_name, resource_type</text>
  <text x="640" y="626" font-size="9" fill="#B0392F" text-anchor="middle">empty -- not loaded</text>
  <text x="640" y="640" font-size="9" fill="#B0392F" text-anchor="middle">no surrogate key (resource_sk)</text>

  <!-- dashed connector "bus" from dims up to the two fact tables,
       routed below the view box (which ends at y=490) and above the
       dims (which start at y=565), so nothing crosses through a box -->
  <!-- dashed connector "bus" from dims up to the two fact tables,
       routed through the gap BETWEEN the two fact boxes (x=560) so it
       clears the view box entirely (view box spans x=230-530) -->
  <line x1="140" y1="565" x2="140" y2="525" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="390" y1="565" x2="390" y2="525" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="640" y1="565" x2="640" y2="525" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="140" y1="525" x2="640" y2="525" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="560" y1="525" x2="560" y2="295" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="560" y1="295" x2="532" y2="295" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow4)"/>
  <line x1="560" y1="295" x2="648" y2="295" stroke="#C9CEE8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow4)"/>
  <text x="480" y="518" font-size="9" fill="#9AA5C7" text-anchor="middle">business-key match (user_id / role_id / resource_id) -- both fact tables</text>

  <text x="30" y="700" font-size="11" fill="#9AA5C7">Business keys (user_id/role_id/resource_id) match today by convention only -- no foreign-key constraint is enforced by Iceberg,</text>
  <text x="30" y="718" font-size="11" fill="#9AA5C7">and the dimension tables carry no data yet. Populating them with surrogate keys (user_sk, role_sk, resource_sk) and Type 2</text>
  <text x="30" y="736" font-size="11" fill="#9AA5C7">history where attributes matter (e.g. a role changing category) is documented as future work, not implemented here.</text>
</svg>
