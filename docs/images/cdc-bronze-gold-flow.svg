<svg viewBox="0 0 1080 490" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B9E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="460" fill="#FFFFFF"/>

  <text x="30" y="38" font-size="20" font-weight="bold" fill="#1E2761">Bronze/Gold: How History Is Actually Preserved</text>
  <text x="30" y="60" font-size="12" fill="#5B6B9E">A change in Postgres becomes a permanent bronze event, then a correct gold access-period record.</text>

  <!-- Step 1: Postgres WAL -->
  <rect x="30" y="100" width="190" height="90" rx="10" fill="#1E2761"/>
  <text x="125" y="135" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Postgres WAL</text>
  <text x="125" y="157" font-size="11" fill="#CADCFC" text-anchor="middle">insert / update / delete</text>
  <text x="125" y="173" font-size="11" fill="#CADCFC" text-anchor="middle">pgoutput logical decode</text>

  <line x1="220" y1="145" x2="270" y2="145" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="245" y="138" font-size="10" fill="#9AA5C7" text-anchor="middle">capture</text>

  <!-- Step 2: Debezium -->
  <rect x="270" y="100" width="170" height="90" rx="10" fill="#2E3E8F"/>
  <text x="355" y="135" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Debezium</text>
  <text x="355" y="157" font-size="11" fill="#CADCFC" text-anchor="middle">unwrap transform</text>
  <text x="355" y="173" font-size="11" fill="#CADCFC" text-anchor="middle">APPEND only</text>

  <line x1="440" y1="145" x2="490" y2="145" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 3: Bronze -->
  <rect x="490" y="90" width="220" height="110" rx="10" fill="#1E2761"/>
  <text x="600" y="125" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Bronze CDC log</text>
  <text x="600" y="148" font-size="11" fill="#CADCFC" text-anchor="middle">every event, immutable</text>
  <text x="600" y="164" font-size="11" fill="#CADCFC" text-anchor="middle">never overwritten</text>
  <text x="600" y="180" font-size="11" fill="#CADCFC" text-anchor="middle">the permanent audit log</text>

  <line x1="600" y1="200" x2="600" y2="250" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="700" y="228" font-size="10" fill="#9AA5C7" text-anchor="middle">bronze -&gt; gold merge</text>

  <!-- Step 4: Gold outputs, two boxes side by side -->
  <rect x="410" y="255" width="210" height="100" rx="10" fill="#2E3E8F"/>
  <text x="515" y="285" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gold: current state</text>
  <text x="515" y="307" font-size="11" fill="#CADCFC" text-anchor="middle">fact_access_grant</text>
  <text x="515" y="323" font-size="11" fill="#CADCFC" text-anchor="middle">latest row per grant</text>
  <text x="515" y="339" font-size="11" fill="#CADCFC" text-anchor="middle">mirrors the source, as-is</text>

  <rect x="650" y="255" width="220" height="100" rx="10" fill="#2E3E8F"/>
  <text x="760" y="280" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gold: access-period</text>
  <text x="760" y="299" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">history</text>
  <text x="760" y="320" font-size="11" fill="#CADCFC" text-anchor="middle">fact_access_grant_history</text>
  <text x="760" y="336" font-size="11" fill="#CADCFC" text-anchor="middle">revoke/delete CLOSES a row</text>

  <line x1="515" y1="355" x2="515" y2="400" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="760" y1="355" x2="760" y2="400" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 5: Query -->
  <rect x="340" y="400" width="620" height="55" rx="10" fill="#1E2761"/>
  <text x="650" y="424" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Trino queries (stands in for Snowflake)</text>
  <text x="650" y="442" font-size="11" fill="#CADCFC" text-anchor="middle">"who had access as of date X?"</text>

  <text x="30" y="475" font-size="11" fill="#9AA5C7">Merge runs after each event during the demo; a production version processes every bronze event in order, not just the latest per grant.</text>
</svg>
