<svg viewBox="0 0 1160 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B9E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="420" fill="#FFFFFF"/>

  <text x="30" y="40" font-size="22" font-weight="bold" fill="#1E2761">Local Data Lake Stack</text>
  <text x="30" y="64" font-size="13" fill="#5B6B9E" font-family="Georgia, serif">PostgreSQL (WAL) &#8594; Debezium Server &#8594; Iceberg REST Catalog &#8594; S3/MinIO &#8594; Trino</text>

  <!-- Postgres -->
  <rect x="30" y="110" width="190" height="110" rx="10" fill="#1E2761"/>
  <text x="125" y="150" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text>
  <text x="125" y="172" font-size="12" fill="#CADCFC" text-anchor="middle">iam_denormalized</text>
  <text x="125" y="190" font-size="12" fill="#CADCFC" text-anchor="middle">WAL (pgoutput)</text>

  <line x1="220" y1="165" x2="280" y2="165" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Debezium Server -->
  <rect x="280" y="95" width="220" height="140" rx="10" fill="#2E3E8F"/>
  <text x="390" y="135" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Debezium Server</text>
  <text x="390" y="157" font-size="12" fill="#CADCFC" text-anchor="middle">debezium-server-iceberg</text>
  <text x="390" y="175" font-size="12" fill="#CADCFC" text-anchor="middle">upsert mode</text>
  <text x="390" y="193" font-size="12" fill="#CADCFC" text-anchor="middle">unwrap transform</text>
  <text x="390" y="211" font-size="12" fill="#CADCFC" text-anchor="middle">no Kafka</text>

  <line x1="500" y1="165" x2="560" y2="165" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Iceberg REST catalog -->
  <rect x="560" y="95" width="220" height="140" rx="10" fill="#2E3E8F"/>
  <text x="670" y="135" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Iceberg REST</text>
  <text x="670" y="155" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Catalog</text>
  <text x="670" y="180" font-size="12" fill="#CADCFC" text-anchor="middle">apache/iceberg-rest-fixture</text>
  <text x="670" y="198" font-size="12" fill="#CADCFC" text-anchor="middle">table metadata + snapshots</text>

  <line x1="670" y1="235" x2="670" y2="280" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MinIO / S3 -->
  <rect x="560" y="280" width="220" height="100" rx="10" fill="#1E2761"/>
  <text x="670" y="318" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MinIO (S3)</text>
  <text x="670" y="340" font-size="12" fill="#CADCFC" text-anchor="middle">Parquet data files</text>
  <text x="670" y="358" font-size="12" fill="#CADCFC" text-anchor="middle">s3://datalake/warehouse</text>

  <line x1="780" y1="165" x2="840" y2="165" stroke="#5B6B9E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Trino -->
  <rect x="840" y="95" width="220" height="140" rx="10" fill="#1E2761"/>
  <text x="950" y="135" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Trino</text>
  <text x="950" y="157" font-size="12" fill="#CADCFC" text-anchor="middle">query engine</text>
  <text x="950" y="175" font-size="12" fill="#CADCFC" text-anchor="middle">star schema (SCD 1/2)</text>
  <text x="950" y="193" font-size="12" fill="#CADCFC" text-anchor="middle">stands in for Snowflake</text>

  <!-- connector line from catalog down to minio also feeds trino conceptually -->
  <line x1="780" y1="330" x2="950" y2="330" stroke="#5B6B9E" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="950" y1="330" x2="950" y2="235" stroke="#5B6B9E" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <text x="30" y="400" font-size="12" fill="#9AA5C7">Live UPDATE in Postgres &#8594; upserted into the Iceberg table within seconds, verified end-to-end.</text>
</svg>
